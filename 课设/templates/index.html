<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中文情感分析 </title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #1d2129;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.6s ease;
        }

        /* ===== 动态氛围光晕 ===== */
        .bg-glow {
            position: fixed;
            top: -30%;
            left: -20%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            transition: background 1s ease, transform 1.5s ease;
            pointer-events: none;
            z-index: 0;
            background: #b3c6ff;
            transform: translate(0, 0);
        }

        .bg-glow.glow-positive {
            background: #7ae0b0;
            transform: translate(20%, 10%);
        }

        .bg-glow.glow-negative {
            background: #ff9a9e;
            transform: translate(-10%, 20%);
        }

        .bg-glow.glow-neutral {
            background: #fcd38d;
            transform: translate(5%, -5%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .header {
            margin-bottom: 28px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 650;
            letter-spacing: -0.5px;
            color: #1d2129;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .header .sub {
            font-size: 15px;
            color: #86909c;
            font-weight: 400;
        }

        /* ===== 卡片通用 ===== */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.03);
            padding: 28px 32px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border-color: rgba(255, 255, 255, 0.9);
        }

        /* ===== 表单 ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1d2129;
            margin-bottom: 8px;
        }

        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #d9dde3;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 110px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
            background: rgba(255, 255, 255, 0.6);
            color: #1d2129;
            line-height: 1.6;
        }

        .form-group textarea::placeholder {
            color: #b3b8c2;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #4e6af3;
            box-shadow: 0 0 0 4px rgba(78, 106, 243, 0.08);
            background: #ffffff;
            transform: scale(1.005);
        }

        /* ===== 按钮（带弹性效果） ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 32px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            background: #4e6af3;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(78, 106, 243, 0.25);
            letter-spacing: 0.3px;
        }

        .btn:hover {
            background: #3b56d9;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(78, 106, 243, 0.35);
        }

        .btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 6px rgba(78, 106, 243, 0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            background: #a0b0f0;
        }

        /* ===== 示例标签 ===== */
        .sample-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .sample-section .label {
            font-size: 13px;
            color: #86909c;
            margin-bottom: 10px;
            font-weight: 450;
        }

        .sample-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sample-tag {
            display: inline-block;
            padding: 5px 16px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 30px;
            font-size: 13px;
            color: #4e5a6b;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            user-select: none;
            backdrop-filter: blur(4px);
        }

        .sample-tag:hover {
            background: rgba(78, 106, 243, 0.08);
            color: #4e6af3;
            border-color: rgba(78, 106, 243, 0.2);
            transform: translateY(-1px);
        }

        .sample-tag:active {
            transform: scale(0.95);
        }

        /* ===== 结果卡片（趣味核心） ===== */
        .result-card {
            display: none;
            animation: cardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-card.show {
            display: block;
        }

        @keyframes cardPop {
            0% {
                opacity: 0;
                transform: scale(0.94) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .result-emoji-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .result-emoji {
            font-size: 38px;
            line-height: 1;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }

        .result-emoji.bounce {
            animation: emojiBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes emojiBounce {
            0% {
                transform: scale(0) rotate(-10deg);
            }
            60% {
                transform: scale(1.3) rotate(4deg);
            }
            100% {
                transform: scale(1) rotate(0);
            }
        }

        .prediction {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .prediction .label {
            font-size: 14px;
            color: #4e5a6b;
            font-weight: 500;
        }

        .prediction-badge {
            font-size: 17px;
            font-weight: 600;
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }

        .prediction-badge.positive {
            background: #e3f5eb;
            color: #0d7a4a;
        }
        .prediction-badge.negative {
            background: #fce8e8;
            color: #b33a3a;
        }
        .prediction-badge.neutral {
            background: #f5f0e0;
            color: #8a7a3a;
        }

        /* ===== 描述标签（趣味短语） ===== */
        .mood-tag {
            font-size: 13px;
            font-weight: 450;
            color: #4e5a6b;
            background: rgba(0, 0, 0, 0.02);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            white-space: nowrap;
        }

        .result-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #86909c;
            align-items: center;
        }

        .result-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== 置信度条（带动画） ===== */
        .confidence-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 6px 0 4px;
        }

        .confidence-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .confidence-item .label {
            font-size: 13px;
            color: #4e5a6b;
            width: 44px;
            flex-shrink: 0;
            text-align: right;
            font-weight: 450;
        }

        .confidence-track {
            flex: 1;
            height: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .confidence-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
        }

        .confidence-fill.positive {
            background: linear-gradient(90deg, #34b36b, #1f8b4c);
        }
        .confidence-fill.negative {
            background: linear-gradient(90deg, #e86060, #c72a2a);
        }
        .confidence-fill.neutral {
            background: linear-gradient(90deg, #e0b34b, #b88a2a);
        }

        .confidence-item .value {
            font-size: 14px;
            font-weight: 600;
            color: #1d2129;
            width: 56px;
            flex-shrink: 0;
            text-align: left;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        /* ===== API 信息 ===== */
        .api-info {
            background: rgba(0, 0, 0, 0.01);
            border-radius: 12px;
            padding: 18px 22px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .api-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: #1d2129;
            margin-bottom: 4px;
        }

        .api-info .desc {
            font-size: 13px;
            color: #86909c;
            margin-bottom: 12px;
        }

        .api-info code {
            display: block;
            background: #1d2129;
            color: #e8e9ed;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-family: "SF Mono", "Fira Code", monospace;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 8px;
            line-height: 1.7;
            border: 1px solid #2d3138;
        }

        .api-info code:last-child {
            margin-bottom: 0;
        }

        /* ===== Loading ===== */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
            .card {
                padding: 20px;
            }
            .header h1 {
                font-size: 24px;
            }
            .result-top {
                flex-direction: column;
                align-items: flex-start;
            }
            .result-emoji {
                font-size: 32px;
            }
            .confidence-item {
                gap: 10px;
            }
            .confidence-item .label,
            .confidence-item .value {
                width: 40px;
                font-size: 12px;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .mood-tag {
                white-space: normal;
                font-size: 12px;
                padding: 2px 12px;
            }
        }

        @media (max-width: 420px) {
            .card {
                padding: 16px;
            }
            .sample-tags {
                gap: 6px;
            }
            .sample-tag {
                font-size: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 动态氛围光晕 -->
    <div class="bg-glow" id="bgGlow"></div>

    <div class="container">

        <!-- 头部 -->
        <div class="header">
            <h1>
                <span>✨ 情感分析</span>
                <span style="font-weight:300; color:#b3b8c2; font-size:22px;">·</span>
                <span style="font-weight:400; font-size:16px; color:#4e5a6b;">趣味实验室</span>
            </h1>
            <div class="sub">输入文本，看看 AI 会读出什么“情绪”</div>
        </div>

        <!-- 输入卡片 -->
        <div class="card">
            <div class="form-group">
                <label for="inputText">
                    <span>📝 评论文本</span>
                    <span style="font-weight:400; font-size:12px; color:#b3b8c2;">（支持 Ctrl+Enter 提交）</span>
                </label>
                <textarea id="inputText" placeholder="例如：这款手机性价比很高，拍照效果非常好！"></textarea>
            </div>

            <button class="btn" id="predictBtn">
                <span>✨ 分析情感</span>
            </button>

            <div class="sample-section">
                <div class="label">⚡ 快速填充示例</div>
                <div class="sample-tags">
                    <span class="sample-tag" data-text="这家餐厅的菜太好吃了，服务也超棒，下次还来！">😊 积极</span>
                    <span class="sample-tag" data-text="质量太差了，用了两天就坏了，客服也不理人。">😠 消极</span>
                    <span class="sample-tag" data-text="外观挺好看，就是续航不太行，勉强能用吧。">😐 中性</span>
                    <span class="sample-tag" data-text="哈哈哈，这设计真是“天才”般的想法！">😂 反讽</span>
                </div>
            </div>
        </div>

        <!-- 结果卡片（趣味反馈） -->
        <div class="card result-card" id="resultCard">
            <div class="result-top">
                <div class="result-emoji-area">
                    <span class="result-emoji" id="resultEmoji">😊</span>
                    <div class="prediction">
                        <span class="label">判定</span>
                        <span class="prediction-badge" id="predictionBadge">正面</span>
                    </div>
                    <span class="mood-tag" id="moodTag">感觉不错！</span>
                </div>
                <div class="result-meta">
                    <span id="inferenceTime">⏱️ —</span>
                    <span>📦 9.1 MB</span>
                </div>
            </div>

            <div class="confidence-group">
                <div class="confidence-item">
                    <span class="label">负面</span>
                    <div class="confidence-track">
                        <div class="confidence-fill negative" id="negativeBar"></div>
                    </div>
                    <span class="value" id="negativeConfidence">0%</span>
                </div>
                <div class="confidence-item">
                    <span class="label">正面</span>
                    <div class="confidence-track">
                        <div class="confidence-fill positive" id="positiveBar"></div>
                    </div>
                    <span class="value" id="positiveConfidence">0%</span>
                </div>
            </div>
        </div>

        <!-- API 说明 -->
        <div class="card">
            <div class="api-info">
                <h3>🔌 API 接口</h3>
                <div class="desc">方便集成到您的应用中</div>
                <code>POST /api/predict
                    Content-Type: application/json

                    {
                    "text": "要分析的文本"
                }</code>
                <code>GET /api/model_info</code>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM 引用
            const inputEl = document.getElementById('inputText');
            const predictBtn = document.getElementById('predictBtn');
            const resultCard = document.getElementById('resultCard');
            const bgGlow = document.getElementById('bgGlow');

            const resultEmoji = document.getElementById('resultEmoji');
            const predictionBadge = document.getElementById('predictionBadge');
            const moodTag = document.getElementById('moodTag');
            const negativeBar = document.getElementById('negativeBar');
            const positiveBar = document.getElementById('positiveBar');
            const negativeConfidence = document.getElementById('negativeConfidence');
            const positiveConfidence = document.getElementById('positiveConfidence');
            const inferenceTime = document.getElementById('inferenceTime');

            // 趣味映射表
            const EMOJI_MAP = {
                '正面': '😊',
                '负面': '😟',
                '中性': '😐'
            };

            const MOOD_MAP = {
                '正面': ['心情大好', '积极向上', '充满阳光', '很赞哦'],
                '负面': ['有点糟糕', '需要改进', '不太满意', '心情低落'],
                '中性': ['平平无奇', '保持中立', '冷静客观', '不好不坏']
            };

            // 获取随机趣味短语
            function getRandomMood(prediction) {
                const list = MOOD_MAP[prediction] || MOOD_MAP['中性'];
                return list[Math.floor(Math.random() * list.length)];
            }

            // 数字滚动动画
            function animateNumber(el, target, suffix = '%') {
                const start = 0;
                const duration = 600;
                const startTime = performance.now();

                function update(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // 缓出效果
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const current = Math.round(eased * target);
                    el.textContent = current + suffix;

                    if (progress < 1) {
                        requestAnimationFrame(update);
                    } else {
                        el.textContent = target + suffix;
                    }
                }
                requestAnimationFrame(update);
            }

            // 更新UI（核心趣味反馈）
            function updateResult(data) {
                const prediction = data.prediction; // '正面' / '负面' / '中性'
                const negPct = Math.round(data.confidence.负面 * 100);
                const posPct = Math.round(data.confidence.正面 * 100);

                // 1. 背景光晕
                bgGlow.className = 'bg-glow';
                if (prediction === '正面') bgGlow.classList.add('glow-positive');
                else if (prediction === '负面') bgGlow.classList.add('glow-negative');
                else bgGlow.classList.add('glow-neutral');

                // 2. 表情 (带动画)
                const newEmoji = EMOJI_MAP[prediction] || '😐';
                if (resultEmoji.textContent !== newEmoji) {
                    resultEmoji.textContent = newEmoji;
                    resultEmoji.classList.remove('bounce');
                    // 触发回流以重启动画
                    void resultEmoji.offsetWidth;
                    resultEmoji.classList.add('bounce');
                }

                // 3. 徽章 & 颜色
                predictionBadge.textContent = prediction;
                predictionBadge.className = 'prediction-badge';
                if (prediction === '正面') predictionBadge.classList.add('positive');
                else if (prediction === '负面') predictionBadge.classList.add('negative');
                else predictionBadge.classList.add('neutral');

                // 4. 趣味标签
                moodTag.textContent = '✨ ' + getRandomMood(prediction);

                // 5. 置信度条 & 数字滚动
                // 先重置宽度（触发过渡）
                negativeBar.style.width = '0%';
                positiveBar.style.width = '0%';

                // 强制回流后设置目标宽度
                requestAnimationFrame(() => {
                    negativeBar.style.width = negPct + '%';
                    positiveBar.style.width = posPct + '%';
                });

                // 数字滚动（从0到目标值）
                animateNumber(negativeConfidence, negPct);
                animateNumber(positiveConfidence, posPct);

                // 6. 推理时间
                inferenceTime.textContent = '⏱️ ' + (data.inference_time_ms || 0) + ' ms';

                // 7. 显示卡片
                resultCard.classList.add('show');
            }

            // 模拟数据（如果后端未就绪，用于演示趣味交互）
            function getMockResult(text) {
                // 简单关键词模拟（仅用于演示效果）
                const posWords = ['好', '棒', '赞', '喜欢', '完美', '优秀', '推荐', '满意', '开心', '感谢'];
                const negWords = ['差', '烂', '坏', '失望', '垃圾', '糟糕', '恶心', '生气', '投诉', '垃圾'];

                let score = 0;
                text.split('').forEach(char => {
                    if (posWords.includes(char)) score += 1.5;
                    if (negWords.includes(char)) score -= 1.5;
                });

                // 随机波动让演示更自然
                score += (Math.random() - 0.5) * 0.8;

                let prediction = '中性';
                let neg = 0.5;
                let pos = 0.5;

                if (score > 0.8) { prediction = '正面';
                    pos = 0.7 + Math.random() * 0.25;
                    neg = 1 - pos; } else if (score < -0.8) { prediction = '负面';
                    neg = 0.7 + Math.random() * 0.25;
                    pos = 1 - neg; } else {
                    prediction = '中性';
                    pos = 0.4 + Math.random() * 0.2;
                    neg = 0.4 + Math.random() * 0.2;
                    // 归一化
                    const sum = pos + neg;
                    pos = pos / sum;
                    neg = neg / sum;
                }

                // 确保总和为1
                const total = pos + neg;
                pos = pos / total;
                neg = neg / total;

                // 取整保持干净
                return {
                    prediction: prediction,
                    confidence: {
                        '负面': Math.round(neg * 100) / 100,
                        '正面': Math.round(pos * 100) / 100
                    },
                    inference_time_ms: Math.round(12 + Math.random() * 28)
                };
            }

            // 预测主函数
            async function predict() {
                const text = inputEl.value.trim();
                if (!text) {
                    alert('请输入要分析的文本');
                    return;
                }

                // 按钮状态
                predictBtn.disabled = true;
                predictBtn.innerHTML = '<span class="spinner"></span> 分析中';

                try {
                    let result;
                    // 尝试真实API，若失败则使用模拟（保证趣味体验不中断）
                    try {
                        const response = await fetch('/api/predict', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text })
                        });

                        if (!response.ok) throw new Error('API 响应异常');
                        result = await response.json();
                        if (result.error) throw new Error(result.error);

                        // 确保数据结构完整
                        if (!result.prediction || !result.confidence) throw new Error('数据不完整');

                    } catch (apiError) {
                        console.warn('使用模拟数据 (API不可用):', apiError);
                        result = getMockResult(text);
                    }

                    // 更新界面
                    updateResult(result);

                } catch (error) {
                    alert('分析出错，请稍后重试');
                } finally {
                    predictBtn.disabled = false;
                    predictBtn.innerHTML = '<span>✨ 分析情感</span>';
                }
            }
            // 页面加载时获取真实模型大小
            async function fetchModelInfo() {
                try {
                    const res = await fetch('/api/model_info');
                    const data = await res.json();
                    if (data.model_size_mb) {
                        const sizeEl = document.querySelector('.result-meta span:last-child');
                        if (sizeEl) sizeEl.textContent = '📦 ' + data.model_size_mb + ' MB';
                    }
                } catch (e) { /* 静默失败，不影响主功能 */ }
            }
            fetchModelInfo();

            // 事件绑定
            window.predict = predict;
            predictBtn.addEventListener('click', predict);

            // Ctrl+Enter
            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    predict();
                }
            });

            // 示例标签点击
            document.querySelectorAll('.sample-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    inputEl.value = this.dataset.text;
                    // 自动触发分析（让反馈更流畅）
                    predict();
                });
            });

            // 初始状态：隐藏结果，重置光晕
            bgGlow.className = 'bg-glow';

        })();
    </script>

</body>
</html>
